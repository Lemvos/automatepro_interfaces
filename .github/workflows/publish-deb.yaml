name: Build ROS2 Debian Package

# Publishing is tag-driven: a Cloudsmith version is immutable, so a release is
# one deliberate v* tag rather than a consequence of a merge. A manual dispatch
# has to select a tag as well; the verify-tag job rejects a branch ref, a tag
# whose commit is not on the default branch, and a tag that disagrees with
# package.xml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Keep in step with the base image the package is built in: this is the Ubuntu
# codename the .deb targets, and it selects the Cloudsmith upload path.
env:
  DEB_CODENAME: jammy

# Least privilege: no job writes to the repository. Checkout needs only
# contents: read, the artifact steps use the Actions runtime token rather than
# GITHUB_TOKEN, and the Cloudsmith push authenticates with its own API key.
# Without this block the workflow inherits the repository default, which can be
# read/write on every scope. No checkout leaves the token in the git config: the
# repository is public, so the tag check's fetch needs no credentials.
permissions:
  contents: read

# The container's /bin/sh is dash, which rejects `set -o pipefail`. Declaring
# bash explicitly avoids the default shell lookup falling back to it.
defaults:
  run:
    shell: bash

jobs:
  # The release gate. It runs on a hosted runner because both checks need git
  # and the ROS container provides none: without a git binary actions/checkout
  # falls back to a REST API tarball, leaving no repository to query. Running it
  # ahead of build-deb means a tag that fails either check spends no build
  # minutes.
  verify-tag:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 because the reachability check below needs the history
      # between the tagged commit and the default branch tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release may only carry a commit that is already on the default branch
      # and so has passed branch CI (ros2-ci.yaml); nothing in this workflow
      # re-runs it. The ref-type check covers the manual dispatch, whose ref is
      # a branch unless a tag is selected.
      - name: Verify the tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a ${GITHUB_REF_TYPE}, not a tag. Run this workflow from a v* tag."
            exit 1
          fi
          git fetch --no-tags origin "${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on ${DEFAULT_BRANCH}. Release tags must point at a merged commit."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} commit ${GITHUB_SHA} is on ${DEFAULT_BRANCH}."

      # bloom takes the .deb version from package.xml, so this is what ties the
      # version the build publishes to the tag it is fetched by.
      - name: Verify the tag matches the package.xml version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' package.xml | head -n1)"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match package.xml version ${PKG_VERSION}. Bump package.xml or retag."
            exit 1
          fi
          echo "Releasing version ${PKG_VERSION}"

  # rosidl generates type support libraries per architecture, so the .deb is
  # architecture-specific: an amd64 host cannot use the arm64 package. arm64 is
  # what the AutomatePro units run; amd64 serves developer machines and other
  # consumers. publish-deb runs only when both builds succeed, so a release
  # never carries one architecture without the other.
  build-deb:
    needs: verify-tag
    strategy:
      matrix:
        include:
          # GitHub-hosted on both architectures: a public repository must not
          # run jobs on a self-hosted runner, which a fork's pull request could
          # reach.
          - arch: arm64
            runner: ubuntu-22.04-arm
          - arch: amd64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    # Well under the 360-minute default, so a wedged build fails instead of
    # holding a runner for six hours.
    timeout-minutes: 45
    container:
      # Digest-pinned so an upstream rebuild or a moved tag cannot silently
      # change what builds the artifact every vessel installs. The same
      # multi-arch index digest as ros2-ci.yaml; bump the digest and the tag
      # together.
      image: ros:humble-ros-base-jammy@sha256:afb40d6be65331c20a114d4e229a7ef099fed1b17bf6370daee193514b32aa16
      options: --user root
    steps:
      # Nothing in this job reads git history, and the container carries no git
      # for it to read with, so checkout takes its default depth.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y python3-bloom python3-rosdep fakeroot dpkg-dev debhelper

      # The ROS image ships an initialized rosdep, so only the index is updated.
      - name: Install package dependencies
        run: |
          rosdep update
          rosdep install --from-paths . --ignore-src -y

      - name: Build Debian package
        run: |
          set -euo pipefail
          bloom-generate rosdebian
          fakeroot debian/rules binary

      - name: Move Debian package to workspace
        run: mv ../*.deb .

      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ros2-deb-package-${{ matrix.arch }}
          path: ./*.deb

  publish-deb:
    needs: build-deb
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: ros2-deb-package-*
          merge-multiple: true

      # Cloudsmith's official CLI action, MIT-licensed.
      # Repo: https://github.com/cloudsmith-io/cloudsmith-cli-action
      #
      # cli-version is pinned rather than left at the action's `latest` default:
      # the action SHA pins the installer, not the binary it installs, and this
      # is the one step of a release that cannot be undone. Bump it deliberately.
      - name: Install Cloudsmith CLI
        uses: cloudsmith-io/cloudsmith-cli-action@69e169e2ad9bc9a1599c2dff464061a00fe9f8ba  # v3.1.1
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          cli-version: '1.20.2'

      # No --republish: Cloudsmith releases are immutable and a repeated version
      # fails here instead of silently replacing the .deb a vessel has already
      # installed. Credentials arrive through env: rather than being interpolated
      # into the script text.
      - name: Push to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CLOUDSMITH_OWNER: ${{ vars.CLOUDSMITH_OWNER }}
          CLOUDSMITH_REPO: ${{ vars.CLOUDSMITH_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDSMITH_API_KEY}" ] || [ -z "${CLOUDSMITH_OWNER}" ] || [ -z "${CLOUDSMITH_REPO}" ]; then
            echo "::error::Missing the CLOUDSMITH_API_KEY secret, or the CLOUDSMITH_OWNER / CLOUDSMITH_REPO variable."
            exit 1
          fi
          for deb in ./*.deb; do
            echo "Uploading ${deb}"
            cloudsmith push deb \
              "${CLOUDSMITH_OWNER}/${CLOUDSMITH_REPO}/ubuntu/${DEB_CODENAME}" \
              "${deb}"
          done
